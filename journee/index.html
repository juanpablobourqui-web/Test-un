<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma Journée</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ma Journée">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101614" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Mise en page : une colonne façon appli (520px max), en-tête de date, barre d'onglets en bas, feuille d'édition qui monte du bas. */
:root {
  color-scheme: light;
  --bg: #f3f5f4; --surface: #ffffff; --ink: #14201c; --muted: #66746f; --line: #dfe5e2; --sunk: #e9eeec;
  --accent: #0b7a68; --accent-ink: #ffffff; --accent-soft: #d8f0ea;
  --now: #e5484d; --star: #e7a100;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --c-travail: #3d6be0; --c-perso: #9b59d0; --c-sport: #e2603a; --c-maison: #c98a12; --c-sante: #17a06d; --c-etudes: #d64584;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #101614; --surface: #19211e; --ink: #ecf2ef; --muted: #98a6a0; --line: #2a3531; --sunk: #222c28;
    --accent: #3cc7ad; --accent-ink: #0b1311; --accent-soft: #173a33; --now: #ff6b6f; --star: #ffc23d;
    --c-travail: #6f95ff; --c-perso: #c08cf0; --c-sport: #ff8a63; --c-maison: #f0b63a; --c-sante: #3fd197; --c-etudes: #ff76ad;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #101614; --surface: #19211e; --ink: #ecf2ef; --muted: #98a6a0; --line: #2a3531; --sunk: #222c28;
  --accent: #3cc7ad; --accent-ink: #0b1311; --accent-soft: #173a33; --now: #ff6b6f; --star: #ffc23d;
  --c-travail: #6f95ff; --c-perso: #c08cf0; --c-sport: #ff8a63; --c-maison: #f0b63a; --c-sante: #3fd197; --c-etudes: #ff76ad;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.screen { max-width: 520px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
.screen[hidden] { display: none !important; }
.muted { color: var(--muted); }

/* En-tête */
.head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); padding-block: 14px 10px; }
.hello { font-size: .9rem; color: var(--muted); font-weight: 500; }
.dateRow { display: flex; align-items: center; gap: 8px; }
.dateRow h1 { font-size: 1.85rem; font-weight: 800; flex: 1; min-width: 0; }
.dateRow h1::first-letter { text-transform: uppercase; }
.circle { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 1.1rem; flex: none; }
.todayChip { border: 0; background: var(--accent-soft); color: var(--accent); font-weight: 700; border-radius: 99px; padding: 6px 12px; font-size: .85rem; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 12px; }
.week button { border: 0; background: none; border-radius: 14px; padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.week .wd { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.week .dn { font: 700 1.05rem var(--display); font-variant-numeric: tabular-nums; }
.week .dots { height: 6px; display: flex; gap: 2px; }
.week .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); opacity: .5; }
.week button.sel { background: var(--ink); color: var(--bg); }
.week button.sel .wd { color: var(--bg); opacity: .7; }
.week button.sel .dots i { background: var(--bg); }
.week button.today:not(.sel) .dn { color: var(--accent); }

/* Résumé */
.summary { display: flex; gap: 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 14px 16px; margin: 6px 0 14px; }
.ring { width: 64px; height: 64px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 800 1rem var(--display); font-variant-numeric: tabular-nums; }
.summary .txt { min-width: 0; flex: 1; }
.summary .big { font: 700 1.1rem var(--display); }
.next { font-size: .92rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.next b { color: var(--ink); }

.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--sunk); border-radius: 14px; padding: 4px; gap: 4px; margin-bottom: 14px; }
.seg button { border: 0; background: none; border-radius: 10px; padding: 8px; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

.banner { display: flex; gap: 10px; align-items: center; background: color-mix(in srgb, var(--star) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--star) 45%, transparent);
  border-radius: 16px; padding: 12px 14px; margin-bottom: 14px; font-size: .95rem; }
.banner div { flex: 1; min-width: 0; }
.banner button { border: 0; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: .85rem; white-space: nowrap; }

/* Liste */
.group { margin-bottom: 18px; }
.group h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-family: var(--body); font-weight: 700; margin: 0 0 8px 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.check { width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid var(--c); background: transparent; flex: none; display: grid; place-items: center; color: #fff; font-size: .9rem; transition: background .15s; }
.row.done .check { background: var(--c); }
.row .main { flex: 1; min-width: 0; background: none; border: 0; text-align: left; padding: 0; }
.row .t { font-weight: 500; display: block; overflow-wrap: anywhere; }
.row.done .t { text-decoration: line-through; color: var(--muted); }
.row .m { font-size: .82rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 1px; }
.tag { display: inline-flex; align-items: center; gap: 4px; }
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.row .star { color: var(--star); }
.row.pop { animation: pop .35s; }
@keyframes pop { 40% { transform: scale(1.03); } }

.empty { text-align: center; padding: 26px 10px 8px; }
.empty svg { width: 120px; height: 120px; }
.empty h2 { font-size: 1.3rem; margin-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px 14px; font-weight: 500; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Planning */
.plan { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.hour { height: 60px; border-top: 1px solid var(--line); display: flex; }
.hour:first-child { border-top: 0; }
.hour span { width: 52px; flex: none; font-size: .75rem; color: var(--muted); padding: 4px 0 0 10px; font-variant-numeric: tabular-nums; }
.hour button { flex: 1; border: 0; background: none; }
.block { position: absolute; border-radius: 12px; padding: 6px 9px; overflow: hidden; font-size: .85rem; border: 0; text-align: left; line-height: 1.25;
  background: color-mix(in srgb, var(--c) 20%, var(--surface)); border-left: 4px solid var(--c); color: var(--ink); }
.block b { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.block small { color: var(--muted); font-variant-numeric: tabular-nums; }
.block.done { opacity: .5; } .block.done b { text-decoration: line-through; }
.nowline { position: absolute; left: 46px; right: 0; height: 2px; background: var(--now); z-index: 3; pointer-events: none; }
.nowline::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--now); }
.untimed { margin-top: 14px; }

/* Bouton + */
.fab { position: fixed; z-index: 20; right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  width: 60px; height: 60px; border-radius: 20px; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 2rem; line-height: 1;
  box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 40%, transparent); }
@media (min-width: 560px) { .fab { right: calc(50% - 260px + 18px); } }
.fab:active { transform: scale(.94); }

/* Barre d'onglets */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line); padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tabbar .in { display: flex; max-width: 520px; margin: 0 auto; justify-content: space-around; }
.tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .74rem; font-weight: 700; color: var(--muted); padding: 6px 16px; }
.tabbar svg { width: 25px; height: 25px; }
.tabbar button.on { color: var(--accent); }
.badge { position: absolute; margin: -4px 0 0 18px; background: var(--now); color: #fff; font-size: .65rem; border-radius: 99px; padding: 0 5px; }

/* Feuille d'édition */
.veil { position: fixed; inset: 0; background: rgba(8, 14, 12, .45); z-index: 40; animation: fade .2s; }
.veil[hidden] { display: none; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 560px; margin: 0 auto; background: var(--surface); border-radius: 26px 26px 0 0;
  padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  max-height: 92%; overflow-y: auto; animation: rise .25s ease-out; }
.sheet[hidden] { display: none; }
@keyframes rise { from { transform: translateY(40px); opacity: .4; } }
.grab { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 0 auto 12px; }
.sheet h2 { font-size: 1.3rem; margin-bottom: 12px; }
.field { margin-bottom: 16px; }
.field > label, .lbl { display: block; font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
.input { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 13px 14px; font-size: 1.05rem; }
.timeRow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.timeRow input[type=time] { flex: 1; min-width: 120px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 8px 12px; font-weight: 500; font-size: .95rem; }
.pill.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill.cat.on { background: var(--c); border-color: var(--c); color: #fff; }
.pill.cat:not(.on)::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: 1px; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
.days .pill { padding: 8px 0; text-align: center; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 12px 14px; width: 100%; text-align: left; }
.toggle .sw { width: 48px; height: 28px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.toggle .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.toggle[aria-checked="true"] .sw { background: var(--star); }
.toggle[aria-checked="true"] .sw::after { transform: translateX(20px); }
.actions { display: grid; gap: 10px; margin-top: 6px; }
.btn { border: 0; border-radius: 16px; padding: 15px; font-weight: 700; font-size: 1.02rem; background: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .45; }
.btn.soft { background: var(--sunk); color: var(--ink); }
.btn.danger { background: none; color: var(--now); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Routines */
.pageTitle { font-size: 1.85rem; font-weight: 800; padding-block: calc(18px + env(safe-area-inset-top, 0px)) 4px; }
.lead { margin: 0 0 16px; color: var(--muted); }
.rdays { display: flex; gap: 3px; }
.rdays i { font-style: normal; font-size: .68rem; width: 18px; height: 18px; border-radius: 6px; display: grid; place-items: center; background: var(--sunk); color: var(--muted); font-weight: 700; }
.rdays i.on { background: var(--c); color: #fff; }

/* Focus */
.focusWrap { display: flex; flex-direction: column; align-items: center; gap: 18px; padding-top: 10px; }
.modes { display: flex; gap: 8px; }
.dial { position: relative; width: min(78vw, 300px); aspect-ratio: 1; max-width: 100%; }
.dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.dial .time { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.dial .time b { font: 800 clamp(3rem, 15vw, 4.4rem) var(--display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.dial .time span { color: var(--muted); font-weight: 500; max-width: 80%; text-align: center; overflow-wrap: anywhere; }
.ctrls { display: flex; gap: 14px; align-items: center; }
.play { width: 84px; height: 84px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 2rem; box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 35%, transparent); }
.round { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 1.3rem; }
.sessions { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.sessions i { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
.focusTask { width: 100%; }
.toast { position: fixed; left: 50%; bottom: calc(160px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 12px; font-weight: 500; max-width: calc(100% - 32px); text-align: center; display: flex; gap: 12px; align-items: center; }
.toast button { border: 0; background: none; color: var(--accent); font-weight: 700; }
.toast[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<!-- Journée -->
<main id="day" class="screen">
  <div class="head">
    <div class="hello" id="hello">Bonjour</div>
    <div class="dateRow">
      <h1 id="dateTitle">Aujourd'hui</h1>
      <button class="todayChip" id="goToday" hidden>Aujourd'hui</button>
      <button class="circle" id="prevWeek" aria-label="Semaine précédente">‹</button>
      <button class="circle" id="nextWeek" aria-label="Semaine suivante">›</button>
    </div>
    <div class="week" id="week"></div>
  </div>
  <div id="lateBanner"></div>
  <div class="summary" id="summary"></div>
  <div class="seg" role="tablist">
    <button id="vList" class="on" role="tab">Liste</button>
    <button id="vPlan" role="tab">Planning</button>
  </div>
  <div id="dayBody"></div>
</main>

<!-- Routines -->
<main id="routines" class="screen" hidden>
  <h1 class="pageTitle">Routines</h1>
  <p class="lead">Ce que tu fais régulièrement. Les routines apparaissent toutes seules dans ta journée.</p>
  <div id="routineList"></div>
  <div class="group" id="routineIdeas"></div>
</main>

<!-- Focus -->
<main id="focus" class="screen" hidden>
  <h1 class="pageTitle">Focus</h1>
  <p class="lead">Travaille 25 minutes sans distraction, puis fais une pause de 5 minutes.</p>
  <div class="focusWrap">
    <div class="modes" id="modes"></div>
    <div class="dial">
      <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--sunk)" stroke-width="9"/>
        <circle id="dialArc" cx="60" cy="60" r="54" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="0"/></svg>
      <div class="time"><b id="clock">25:00</b><span id="focusLabel">Concentration</span></div>
    </div>
    <div class="ctrls">
      <button class="round" id="fReset" aria-label="Recommencer">↺</button>
      <button class="play" id="fPlay" aria-label="Démarrer">▶</button>
      <button class="round" id="fSkip" aria-label="Passer à la suite">⏭</button>
    </div>
    <div class="muted" id="sessionTxt"></div>
    <div class="sessions" id="sessionDots"></div>
    <div class="field focusTask">
      <label for="focusSel">Je travaille sur</label>
      <select class="input" id="focusSel"></select>
    </div>
  </div>
</main>

<button class="fab" id="fab" aria-label="Ajouter">+</button>

<nav class="tabbar" id="tabbar">
  <div class="in">
    <button data-go="day" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M8 14l2.5 2.5L16 12"/></svg>Journée</button>
    <button data-go="routines"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.5-4.6M4 4v3.5h3.5M4 13a8 8 0 0 0 14.5 4.6M20 20v-3.5h-3.5"/></svg>Routines</button>
    <button data-go="focus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/></svg>Focus</button>
  </div>
</nav>

<div class="veil" id="veil" hidden></div>
<form class="sheet" id="sheet" hidden autocomplete="off"></form>
<div class="toast" id="toast" role="status" hidden></div>

<script>
// ---------- Données ----------
const CATS = [
  { id: "travail", name: "Travail" }, { id: "perso", name: "Perso" }, { id: "sport", name: "Sport" },
  { id: "maison", name: "Maison" }, { id: "sante", name: "Santé" }, { id: "etudes", name: "Études" }
];
const catName = id => (CATS.find(c => c.id === id) || CATS[1]).name;
const catVar = id => `var(--c-${id || "perso"})`;
const WD = ["Dim", "Lun", "Mar", "Mer", "Jeu", "Ven", "Sam"];
const WD1 = ["D", "L", "M", "M", "J", "V", "S"];
const IDEAS = [
  { title: "Boire un grand verre d'eau", cat: "sante", time: "08:00", dur: 15 },
  { title: "Faire du sport", cat: "sport", time: "18:30", dur: 45 },
  { title: "Pratiquer l'anglais (Parle Anglais)", cat: "etudes", time: "20:30", dur: 15 },
  { title: "Lire 20 minutes", cat: "perso", time: "22:00", dur: 20 },
  { title: "Ranger 10 minutes", cat: "maison", time: "", dur: 15 },
  { title: "Préparer la journée de demain", cat: "perso", time: "21:30", dur: 15 }
];
const DAY_IDEAS = [
  { title: "Courses", cat: "maison", dur: 45 }, { title: "Appeler la famille", cat: "perso", dur: 30 },
  { title: "Répondre aux e-mails", cat: "travail", dur: 30 }, { title: "Marcher 30 minutes", cat: "sport", dur: 30 },

// ---------- Éléments d'une journée ----------
function itemsFor(k) {
  const wd = parse(k).getDay();
  const tasks = S.tasks.filter(t => t.date === k).map(t => ({ ...t, kind: "task", isDone: !!t.done }));
  const routs = S.routines.filter(r => r.days.includes(wd) && (!r.from || r.from <= k))
    .map(r => ({ ...r, kind: "routine", isDone: !!S.rdone[r.id + "|" + k] }));

}
const sortTimed = (a, b) => toMin(a.time) - toMin(b.time);

  else { const key = it.id + "|" + k; if (S.rdone[key]) delete S.rdone[key]; else S.rdone[key] = 1; }
  save();
}

let screen = "day", sel = todayKey(), weekStart = mondayOf(sel);

// ---------- Écran Journée ----------
function renderDay() {

  $("hello").textContent = h < 5 ? "Bonne nuit 🌙" : h < 12 ? "Bonjour ☀️" : h < 18 ? "Bon après-midi" : "Bonsoir 🌙";
  const d = parse(sel);

  $("dateTitle").textContent = rel ? rel : d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  $("dateTitle").title = d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  $("goToday").hidden = sel === t;

    const k = addDays(weekStart, i), dd = parse(k), n = itemsFor(k).length;
    return `<button data-k="${k}" class="${k === sel ? "sel" : ""} ${k === t ? "today" : ""}" aria-label="${dd.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric" })}">
      <span class="wd">${WD[dd.getDay()]}</span><span class="dn">${dd.getDate()}</span><span class="dots">${"<i></i>".repeat(Math.min(3, n))}</span></button>`;

  if ($("moveLate")) $("moveLate").onclick = () => { late.forEach(x => x.date = t); save(); renderDay(); toast(late.length + " tâche(s) ajoutée(s) à aujourd'hui"); };
  // résumé
  const items = itemsFor(sel), done = items.filter(i => i.isDone).length, total = items.length;
  const pct = total ? done / total : 0;
  const upcoming = sel === t ? items.filter(i => !i.isDone && i.time && toMin(i.time) + (i.dur || 30) > nowMin()).sort(sortTimed)[0] : items.filter(i => !i.isDone && i.time).sort(sortTimed)[0];

function renderList(items) {

function renderPlan(items) {
  const b = $("dayBody"), H0 = 6, H1 = 24, PX = 60;
  const timed = items.filter(i => i.time).map(i => ({ ...i, s: toMin(i.time), e: toMin(i.time) + Math.max(15, i.dur || 30) })).sort((a, b) => a.s - b.s);

  const flush = () => { const lanes = []; cluster.forEach(it => { let l = lanes.findIndex(x => x <= it.s); if (l < 0) { l = lanes.length; lanes.push(0); } lanes[l] = it.e; it.lane = l; }); cluster.forEach(it => { it.lanes = lanes.length; out.push(it); }); cluster = []; };

      <b>${it.star ? "★ " : ""}${esc(it.title)}</b>${h > 38 ? `<small>${fmt(it.s)}–${fmt(it.e)}</small>` : ""}</button>`;
  }).join("");
  const n = nowMin(), nowLine = sel === todayKey() && n / 60 >= first ? `<div class="nowline" style="top:${(n / 60 - first) * PX}px"></div>` : "";
  const free = items.filter(i => !i.time);
  b.innerHTML = `<div class="plan" id="plan">${hours.map(h => `<div class="hour"><span>${String(h).padStart(2, "0")}:00</span><button type="button" data-h="${h}" aria-label="Ajouter à ${h} h"></button></div>`).join("")}${blocks}${nowLine}</div>
    ${free.length ? `<div class="group untimed"><h3>Sans horaire</h3><div class="card">${free.map(rowHTML).join("")}</div></div>` : ""}`;

    ${Array.from({ length: 8 }, (_, i) => { const a = i * Math.PI / 4, x1 = 60 + Math.cos(a) * 36, y1 = 62 + Math.sin(a) * 36, x2 = 60 + Math.cos(a) * 46, y2 = 62 + Math.sin(a) * 46; return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--star)" stroke-width="5" stroke-linecap="round"/>`; }).join("")}
    <path d="M50 64q10 9 20 0" stroke="var(--ink)" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="51" cy="56" r="3" fill="var(--ink)"/><circle cx="69" cy="56" r="3" fill="var(--ink)"/></svg>`;

$("week").onclick = e => { const b = e.target.closest("[data-k]"); if (b) { sel = b.dataset.k; tick(); renderDay(); } };

      <span class="check" style="border-style:dashed" aria-hidden="true"></span>
      <button type="button" class="main"><span class="t">${r.star ? '<span class="star">★</span> ' : ""}${esc(r.title)}</span>
        <span class="m">${r.time ? `<span>${r.time}</span>` : "<span>Sans horaire</span>"}<span class="tag">${catName(r.cat)}</span></span></button>
      <span class="rdays">${[1, 2, 3, 4, 5, 6, 0].map(w => `<i class="${r.days.includes(w) ? "on" : ""}">${WD1[w]}</i>`).join("")}</span>
    </div>`).join("")}</div></div>` : "";
  const ideas = IDEAS.filter(x => !S.routines.some(r => r.title === x.title));
  $("routineIdeas").innerHTML = ideas.length ? `<h3>${list.length ? "Autres idées" : "Pour commencer, ajoute une idée"}</h3><div class="chips" style="justify-content:flex-start">${ideas.map(x => `<button type="button" class="chip" data-ri="${IDEAS.indexOf(x)}">+ ${esc(x.title)}</button>`).join("")}</div>` : "";
}
$("routineList").onclick = e => { const r = e.target.closest("[data-rid]"); if (!r) return; const x = S.routines.find(y => y.id === r.dataset.rid); if (x) openSheet({ ...x, kind: "routine" }); };
$("routineIdeas").onclick = e => { const b = e.target.closest("[data-ri]"); if (!b) return; const x = IDEAS[+b.dataset.ri];
  S.routines.push({ id: uid(), title: x.title, cat: x.cat, time: x.time, dur: x.dur, star: false, days: [0, 1, 2, 3, 4, 5, 6], from: todayKey() }); save(); tick(); renderRoutines(); toast("Routine ajoutée : tous les jours"); };

// ---------- Focus ----------
const MODES = { focus: { name: "Concentration", min: 25 }, short: { name: "Pause", min: 5 }, long: { name: "Grande pause", min: 15 } };
const F = { mode: "focus", left: 25 * 60, running: false, end: 0, task: "", timer: null };
function focusCount() { return S.focus[todayKey()] || 0; }
function renderFocus() {
  $("modes").innerHTML = Object.entries(MODES).map(([k, m]) => `<button type="button" class="pill ${F.mode === k ? "on" : ""}" data-mode="${k}">${m.name}</button>`).join("");
  const todayTasks = itemsFor(todayKey()).filter(i => !i.isDone).map(i => i.title);
  if (F.task && !todayTasks.includes(F.task)) todayTasks.unshift(F.task);
  $("focusSel").innerHTML = `<option value="">Rien de précis</option>` + todayTasks.map(t => `<option ${t === F.task ? "selected" : ""}>${esc(t)}</option>`).join("");
  const n = focusCount();
  $("sessionTxt").textContent = n ? `${n} séance${n > 1 ? "s" : ""} de concentration aujourd'hui · ${n * 25} min` : "Aucune séance aujourd'hui pour l'instant";
  $("sessionDots").innerHTML = "<i></i>".repeat(Math.min(n, 16));
  drawClock();
}
function drawClock() {
  const total = MODES[F.mode].min * 60, left = F.running ? Math.max(0, Math.round((F.end - Date.now()) / 1000)) : F.left;
  $("clock").textContent = String(Math.floor(left / 60)).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0");
  $("dialArc").setAttribute("stroke-dashoffset", (339.3 * (1 - left / total)).toFixed(1));
  $("dialArc").setAttribute("stroke", F.mode === "focus" ? "var(--accent)" : "var(--star)");
  $("focusLabel").textContent = F.task && F.mode === "focus" ? F.task : MODES[F.mode].name;
  $("fPlay").textContent = F.running ? "❚❚" : "▶"; $("fPlay").setAttribute("aria-label", F.running ? "Pause" : "Démarrer");
  if (F.running) document.title = $("clock").textContent + " · Ma Journée"; else document.title = "Ma Journée";
  if (F.running && left <= 0) finishFocus();
}
function setMode(m) { F.mode = m; F.running = false; clearInterval(F.timer); F.left = MODES[m].min * 60; if (screen === "focus") renderFocus(); }
function finishFocus() {
  F.running = false; clearInterval(F.timer); chime();
  if (F.mode === "focus") { S.focus[todayKey()] = focusCount() + 1; save(); toast("Bravo ! Séance terminée. Place à la pause ☕"); setMode(focusCount() % 4 === 0 ? "long" : "short"); }
  else { toast("Pause terminée. On s'y remet ?"); setMode("focus"); }
}
$("modes").onclick = e => { const b = e.target.closest("[data-mode]"); if (b) { tick(); setMode(b.dataset.mode); } };
$("fPlay").onclick = () => {
  tick();
  if (F.running) { F.left = Math.max(0, Math.round((F.end - Date.now()) / 1000)); F.running = false; clearInterval(F.timer); }
  else { F.end = Date.now() + F.left * 1000; F.running = true; F.timer = setInterval(drawClock, 500); }
  drawClock();
};
$("fReset").onclick = () => setMode(F.mode);
$("fSkip").onclick = () => { if (F.mode === "focus") setMode("short"); else setMode("focus"); };
$("focusSel").onchange = () => { F.task = $("focusSel").value; drawClock(); };
document.addEventListener("visibilitychange", () => { if (!document.hidden) { if (F.running) drawClock(); if (screen === "day") renderDay(); } });

// ---------- Démarrage ----------
go("day");
setInterval(() => { if (screen === "day" && !draft) renderDay(); }, 60000);
if ("serviceWorker" in navigator && location.protocol === "https:" && /github\.io$/.test(location.hostname)) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
