# Publie l'application sur GitHub Pages à chaque mise à jour.
name: Publier l'application

on:
  push:
    branches: [claude/test-un-repo-setup-2ajz66]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer les fichiers du site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js icons journee .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
